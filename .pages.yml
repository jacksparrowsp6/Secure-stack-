content:
  - name: articles
    label: Articles
    path: content/articles
    type: collection
    filename: '{fields.slug}.md'
    view:
      fields: [title, category, updatedAt]
      primary: title
      sort:
        field: updatedAt
        direction: desc
    fields:
      - name: title
        label: SEO title
        type: string
        required: true
      - name: description
        label: Meta description
        type: text
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
      - name: legacyPath
        label: Legacy Blogspot path (do not change)
        type: string
        required: false
      - name: category
        label: Category
        type: string
        required: true
      - name: publishedAt
        label: Publication date (owner only)
        type: date
        required: true
      - name: updatedAt
        label: Last updated (owner only)
        type: date
        required: true
      - name: body
        label: Article body
        type: rich-text
media:
  input: public/media
  output: /media
